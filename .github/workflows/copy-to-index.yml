name: Copy to index
on:
  workflow_dispatch:
jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp duelo-neural-en-linea.html index.html
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update index.html from duelo-neural-en-linea.html
