name: Copy duelo-neural-en-linea.html to index.html

on:
  push:
    branches: [main]
    paths:
      - duelo-neural-en-linea.html
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy-to-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy file to index.html
        run: cp duelo-neural-en-linea.html index.html
      - name: Commit index.html if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Actualizar index.html desde duelo-neural-en-linea.html"
          git push
