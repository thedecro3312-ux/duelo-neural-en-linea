name: Copiar a index.html

on:
  workflow_dispatch:

jobs:
  copy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Copiar duelo-neural-en-linea.html a index.html
        run: cp duelo-neural-en-linea.html index.html
      - name: Confirmar cambio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Actualiza index.html desde duelo-neural-en-linea.html" || echo "Sin cambios"
          git push
