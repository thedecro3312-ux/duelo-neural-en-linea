name: Copy to index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy file to index.html
        run: |
          cp duelo-neural-en-linea.html index.html
          rm duelo-neural-en-linea.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git add -A
          git commit -m "Publish: copia adaptada (Clon)" || echo "nothing to commit"
          git push
