name: Copiar a index

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy-to-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Copiar duelo-neural-en-linea.html a index.html
        run: cp duelo-neural-en-linea.html index.html
      - name: Confirmar cambio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Actualizar index.html desde duelo-neural-en-linea.html"
          git push
