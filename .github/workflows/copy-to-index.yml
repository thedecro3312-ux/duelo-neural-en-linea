name: copy-to-index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cp duelo-neural-en-linea-new.html index.html
          rm duelo-neural-en-linea-new.html
          git config user.name "thedecro3312-ux"
          git config user.email "thedecro3312@gmail.com"
          git add -A
          git commit -m "Publish audited DUELO NEURAL (113 card fixes)" || echo "nothing to commit"
          git push
