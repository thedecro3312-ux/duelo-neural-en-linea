name: Copiar a index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  copiar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copiar archivo a index.html
        run: cp duelo-neural-en-linea.html index.html
      - name: Confirmar index.html actualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Actualiza index.html desde duelo-neural-en-linea.html"
          git push
