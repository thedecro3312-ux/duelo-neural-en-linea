name: Copiar a index
on:
  workflow_dispatch:
jobs:
  copy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Copiar archivo a index.html
        run: cp duelo-neural-en-linea.html index.html
      - name: Commit y push de index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Actualizar index.html desde duelo-neural-en-linea.html"
          git push
