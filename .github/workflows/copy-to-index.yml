name: Copy to index

on:
  workflow_dispatch:

jobs:
  copy-to-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Copy duelo-neural-en-linea.html to index.html
        run: cp duelo-neural-en-linea.html index.html
      - name: Commit index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update index.html from duelo-neural-en-linea.html" || echo "No changes to commit"
          git push
