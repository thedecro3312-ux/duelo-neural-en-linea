name: Copy to index

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copiar duelo-neural-en-linea.html a index.html
        run: cp duelo-neural-en-linea.html index.html
      - name: Confirmar index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Sincroniza index.html con duelo-neural-en-linea.html"
          git push
